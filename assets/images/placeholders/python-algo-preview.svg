<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0b1b3d" />
    </linearGradient>
    <linearGradient id="pygrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg3)" />
  <circle cx="120" cy="100" r="140" fill="#38bdf8" opacity="0.12" filter="blur(40px)" />
  <circle cx="500" cy="260" r="150" fill="#facc15" opacity="0.1" filter="blur(40px)" />

  <!-- Code Editor Window Mockup -->
  <g transform="translate(60, 40)">
    <rect width="480" height="280" rx="14" fill="#0d1117" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>
    <rect width="480" height="36" rx="14" fill="#161b22"/>
    <rect y="22" width="480" height="14" fill="#161b22"/>
    <circle cx="20" cy="18" r="4.5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="4.5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="4.5" fill="#10b981"/>
    <rect x="80" y="9" width="160" height="18" rx="6" fill="#21262d"/>
    <text x="160" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#58a6ff" text-anchor="middle">solution.py — LeetCode</text>

    <!-- Code lines -->
    <text x="35" y="75" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ff7b72">class <tspan fill="#d2a8ff">Solution</tspan>:</text>
    <text x="55" y="100" font-family="'JetBrains Mono', monospace" font-size="12" fill="#79c0ff">    def <tspan fill="#d2a8ff">twoSum</tspan><tspan fill="#e6edf3">(self, nums: List[int], target: int) -&gt; List[int]:</tspan></text>
    <text x="75" y="125" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b949e">        # Hash table approach: O(n) time complexity</text>
    <text x="75" y="150" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e6edf3">        lookup = {}</text>
    <text x="75" y="175" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ff7b72">        for <tspan fill="#e6edf3">i, num</tspan> in <tspan fill="#79c0ff">enumerate</tspan><tspan fill="#e6edf3">(nums):</tspan></text>
    <text x="95" y="200" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ff7b72">            if <tspan fill="#e6edf3">(target - num)</tspan> in <tspan fill="#e6edf3">lookup:</tspan></text>
    <text x="115" y="225" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ff7b72">                return <tspan fill="#e6edf3">[lookup[target - num], i]</tspan></text>
    <text x="95" y="250" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e6edf3">            lookup[num] = i</text>

    <!-- Test badge -->
    <rect x="330" y="220" width="130" height="36" rx="8" fill="#1b4728" stroke="#2ea043" stroke-width="1"/>
    <text x="395" y="243" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#56d364" text-anchor="middle">Accepted · 100%</text>
  </g>
</svg>
