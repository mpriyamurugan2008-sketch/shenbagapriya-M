<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg1)" />
  <circle cx="100" cy="80" r="140" fill="#6366f1" opacity="0.15" filter="blur(40px)" />
  <circle cx="500" cy="280" r="160" fill="#ec4899" opacity="0.12" filter="blur(50px)" />
  
  <!-- Browser Window Mockup -->
  <g transform="translate(60, 40)">
    <rect width="480" height="280" rx="14" fill="#0d1117" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- Window Bar -->
    <rect width="480" height="36" rx="14" fill="#161b22"/>
    <rect y="22" width="480" height="14" fill="#161b22"/>
    <circle cx="20" cy="18" r="4.5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="4.5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="4.5" fill="#10b981"/>
    <rect x="80" y="9" width="220" height="18" rx="6" fill="#21262d"/>
    <text x="190" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8b949e" text-anchor="middle">shenbagapriya.dev/portfolio</text>

    <!-- Layout Mockup -->
    <rect x="30" y="60" width="160" height="18" rx="4" fill="url(#glow1)"/>
    <rect x="30" y="88" width="240" height="10" rx="3" fill="#30363d"/>
    <rect x="30" y="104" width="200" height="10" rx="3" fill="#30363d"/>
    
    <rect x="30" y="135" width="80" height="24" rx="6" fill="#6366f1"/>
    <rect x="120" y="135" width="80" height="24" rx="6" fill="none" stroke="#6366f1" stroke-width="1.5"/>
    
    <!-- Hero graphic card inside window -->
    <rect x="300" y="60" width="150" height="180" rx="12" fill="#1c2128" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="375" cy="115" r="32" fill="#6366f1" opacity="0.3"/>
    <rect x="325" y="165" width="100" height="10" rx="3" fill="#8b949e"/>
    <rect x="340" y="185" width="70" height="8" rx="3" fill="#484f58"/>
    
    <!-- Interactive badge -->
    <rect x="30" y="210" width="240" height="35" rx="8" fill="#161b22" stroke="rgba(99,102,241,0.3)"/>
    <text x="45" y="232" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">Responsive Web Architecture</text>
  </g>
</svg>
