<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f2d" />
      <stop offset="50%" stop-color="#1e143b" />
      <stop offset="100%" stop-color="#0c0a1e" />
    </linearGradient>
    <linearGradient id="genAIGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg4)" />
  <circle cx="200" cy="120" r="160" fill="#a855f7" opacity="0.15" filter="blur(40px)" />
  <circle cx="450" cy="240" r="140" fill="#3b82f6" opacity="0.12" filter="blur(40px)" />

  <!-- Generative AI Node Network Mockup -->
  <g transform="translate(60, 40)">
    <rect width="480" height="280" rx="14" fill="#0d0e1a" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.5"/>
    <text x="240" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="1">DATABRICKS GENERATIVE AI</text>
    <text x="240" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">LLMs · Prompt Engineering · Vector Embeddings · RAG</text>

    <!-- Visual network nodes -->
    <!-- Input prompt -->
    <rect x="35" y="110" width="105" height="90" rx="10" fill="#1e1838" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
    <text x="87" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#f3e8ff" text-anchor="middle">User Prompt</text>
    <text x="87" y="165" font-family="'Inter', sans-serif" font-size="9" fill="#a855f7" text-anchor="middle">Context Input</text>

    <!-- Arrow 1 -->
    <path d="M 145 155 L 180 155" stroke="url(#genAIGrad)" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- Neural Engine -->
    <rect x="185" y="95" width="115" height="120" rx="12" fill="url(#genAIGrad)" opacity="0.15"/>
    <rect x="185" y="95" width="115" height="120" rx="12" fill="none" stroke="url(#genAIGrad)" stroke-width="1.5"/>
    <circle cx="242" cy="140" r="22" fill="#a855f7" opacity="0.3"/>
    <text x="242" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">✦</text>
    <text x="242" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">GenAI Model</text>
    <text x="242" y="196" font-family="'Inter', sans-serif" font-size="9" fill="#e9d5ff" text-anchor="middle">Foundations</text>

    <!-- Arrow 2 -->
    <path d="M 305 155 L 340 155" stroke="url(#genAIGrad)" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- Output / Synthesis -->
    <rect x="345" y="110" width="105" height="90" rx="10" fill="#1e1838" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
    <text x="397" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#dbeafe" text-anchor="middle">Synthesis</text>
    <text x="397" y="165" font-family="'Inter', sans-serif" font-size="9" fill="#60a5fa" text-anchor="middle">Structured Output</text>

    <!-- Bottom summary tag -->
    <rect x="140" y="235" width="200" height="26" rx="13" fill="#241a45" stroke="rgba(236,72,153,0.3)"/>
    <text x="240" y="252" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#f472b6" text-anchor="middle">AI-Driven UI Architecture</text>
  </g>
</svg>
